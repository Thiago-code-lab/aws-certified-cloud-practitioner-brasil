<svg role="img" aria-labelledby="diagram-title diagram-description" xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
  <title id="diagram-title">Essential Security Flow</title>
  <desc id="diagram-description">Identity controls, CloudTrail audit events, and configured monitoring alerts form complementary security controls.</desc>
  <rect width="900" height="360" fill="#0f172a"/>
  <text x="40" y="42" fill="#f8fafc" font-family="Arial" font-size="24">Essential Security Flow</text>
  <rect x="60" y="100" width="180" height="80" rx="10" fill="#1e293b" stroke="#34d399"/>
  <text x="95" y="145" fill="#e2e8f0" font-family="Arial" font-size="18">IAM + MFA</text>
  <rect x="340" y="100" width="180" height="80" rx="10" fill="#1e293b" stroke="#34d399"/>
  <text x="375" y="145" fill="#e2e8f0" font-family="Arial" font-size="18">CloudTrail</text>
  <rect x="620" y="100" width="180" height="80" rx="10" fill="#1e293b" stroke="#34d399"/>
  <text x="675" y="145" fill="#e2e8f0" font-family="Arial" font-size="18">Alarms</text>
  <line x1="240" y1="140" x2="340" y2="140" stroke="#22d3ee" stroke-width="3"/>
  <line x1="520" y1="140" x2="620" y2="140" stroke="#22d3ee" stroke-width="3"/>
  <text x="60" y="260" fill="#94a3b8" font-family="Arial" font-size="18">Purpose: Authenticate, audit and react quickly.</text>
</svg>
